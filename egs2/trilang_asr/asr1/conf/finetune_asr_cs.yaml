# Per global resolution: CS fine-tuning ONLY, never mixed with initial train
encoder: conformer
encoder_conf:
    output_size: 256        # NEW: 256 (vs 512 in full) for VRAM constraint
    attention_heads: 4
    linear_units: 2048
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    normalize_before: true
    macaron_style: true
    rel_pos_type: latest
    pos_enc_layer_type: rel_pos
    selfattention_layer_type: rel_selfattn
    activation_type: swish
    use_cnn_module: true
    cnn_module_kernel: 31    

decoder: transformer
decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.1
    src_attention_dropout_rate: 0.1

model:
    ctc_weight: 0.3

optim: adam
optim_conf:
    lr: 0.0002          # NEW: 10x lower than initial training for fine-tuning stability
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 5000  # NEW: shorter warmup for fine-tuning

specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    apply_time_mask: true
    time_mask_width_ratio_range: [0., 0.05]
    num_time_mask: 2
    apply_freq_mask: true
    freq_mask_width_range: [0, 27]
    num_freq_mask: 2

max_epoch: 20           # NEW: CS fine-tuning capped at 20 epochs (TA timeline)
patience: 3
val_scheduler_criterion:
    - valid
    - acc
best_model_criterion:
    - - valid
      - acc
      - max

batch_type: numel
batch_bins: 4000000
num_workers: 2
