batch_type: numel
batch_bins: 1000000 # server: 1000000 - 32; local: 800000 - 40; Based on LS100: 2000000 -16
accum_grad: 32
max_epoch: 60
patience: none
init: none
best_model_criterion:
  - - valid
    - acc # LS100: cer_ctc; local: acc - LS100 based
    - max # LS100: min; local: max - LS100 based
keep_nbest_models: 10

# add seed for fixed results test
seed: 777

encoder: conformer
encoder_conf:
  output_size: 256
  attention_heads: 4
  linear_units: 1024
  num_blocks: 18
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.1
  input_layer: conv2d
  normalize_before: true
  macaron_style: true
  rel_pos_type: latest
  pos_enc_layer_type: rel_pos
  selfattention_layer_type: rel_selfattn
  activation_type: swish
  use_cnn_module: true
  cnn_module_kernel: 31

# Add decoder LS100 based
decoder: transformer
decoder_conf:
  attention_heads: 4
  linear_units: 1024
  num_blocks: 4
  normalize_before: true
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  self_attention_dropout_rate: 0.1
  src_attention_dropout_rate: 0.15

# test on server; results: enable
val_scheduler_criterion:
  - valid
  - acc
num_workers: 2

model_conf:
  ctc_weight: 0.5 # LS100: 1.0; server: 0.5
  lsm_weight: 0.1
  length_normalized_loss: false

optim: adam
optim_conf:
  lr: 0.002 # epoch 60 peaked at 6e-4; didnt want to risk changes
  weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
  warmup_steps: 15000

# num_att_plot: 0 # hide to visualize attn for hybrid model

specaug: specaug
specaug_conf:
  apply_time_warp: true
  time_warp_window: 5
  time_warp_mode: bicubic
  apply_freq_mask: true
  freq_mask_width_range:
    - 0
    - 27
  num_freq_mask: 2
  apply_time_mask: true
  time_mask_width_ratio_range:
    - 0.
    - 0.05
  num_time_mask: 5
